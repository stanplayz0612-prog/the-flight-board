<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Avioframe — Live Overhead Flight Frame</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Gallery Frame Theme Modes */
    body.theme-gallery {
      background-color: #f4f3ef;
      color: #14171a;
      --card-bg: #ffffff;
      --card-border: rgba(20, 23, 26, 0.08);
      --muted-text: #64748b;
      --pill-bg: #f1f5f9;
      --accent: #0284c7;
      --radar-bg: #07110e;
      --shadow-frame: 0 24px 60px -15px rgba(15, 23, 42, 0.14), 0 0 0 1px rgba(15, 23, 42, 0.05);
    }

    body.theme-night {
      background-color: #080b10;
      color: #f8fafc;
      --card-bg: #111622;
      --card-border: rgba(255, 255, 255, 0.08);
      --muted-text: #94a3b8;
      --pill-bg: #1e293b;
      --accent: #38bdf8;
      --radar-bg: #050c09;
      --shadow-frame: 0 28px 70px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.07);
    }

    .frame-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-frame);
      transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .mono {
      font-family: var(--font-mono);
    }

    /* Split-flap mechanical tile aesthetic */
    .flap-tile {
      position: relative;
      background: linear-gradient(180deg, #1e2530 0%, #161b24 49%, #0f131a 51%, #1a202c 100%);
      color: #f8fafc;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
    }

    .flap-tile::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: rgba(0, 0, 0, 0.65);
    }

    /* Subtle float on poster aircraft */
    @keyframes planeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .plane-float {
      animation: planeFloat 4.2s ease-in-out infinite;
    }

    /* Custom subtle scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .live-pulse { animation: pulse-dot 2s infinite ease-in-out; }

    /* FLIGHTWALL FULLSCREEN MODE */
    body.flightwall-mode {
      padding: 0 !important;
    }
    body.flightwall-mode header,
    body.flightwall-mode nav,
    body.flightwall-mode #poster-nearby-bar {
      display: none !important;
    }
    body.flightwall-mode main {
      max-width: 100% !important;
      margin: 0 !important;
      height: 100vh !important;
    }
    body.flightwall-mode #mainFrameContainer {
      border-radius: 0 !important;
      border: none !important;
    }
  </style>
</head>
<body class="theme-night select-none flex flex-col justify-between p-3 sm:p-5 md:p-6">

  <!-- FLOATING EXIT FLIGHTWALL BUTTON -->
  <button id="flightwallExitBtn" onclick="toggleFlightwall()"
    class="hidden fixed top-4 right-4 z-50 px-3.5 py-2 rounded-full bg-slate-900/80 hover:bg-slate-800 border border-white/20 backdrop-blur-md text-xs mono font-bold text-white flex items-center gap-1.5 shadow-lg transition">
    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
    <span>Exit Flightwall</span>
  </button>

  <!-- TOP AMBIENT STATUS BAR -->
  <header class="w-full max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2 z-20">
    <!-- Brand & Quick-Switch Airport Station -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-sky-600 text-white flex items-center justify-center shadow-sm shrink-0">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-bold tracking-tight text-base sm:text-lg">AVIOFRAME</span>
          <button id="stationBadge" onclick="cycleAirport()" title="Tap to switch airport (EGMC / EGLL / EGSS / EGCC)"
            class="inline-flex items-center gap-1 text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-sky-500/15 hover:bg-sky-500/25 text-sky-600 dark:text-sky-400 mono transition active:scale-95">
            <span id="stationBadgeText">SOUTHEND (EGMC)</span>
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
        <p id="statusSubline" class="text-xs opacity-65">Scanning UK live airspace…</p>
      </div>
    </div>

    <!-- Live Feed Pill & Quick Controls -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- Live Feed Status Pill (Tap to force rescan) -->
      <button id="feedStatusPill" onclick="fetchLiveAirspace(true)" title="Tap to force live radar scan"
        class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-300/60 dark:border-slate-700/70 bg-white/80 dark:bg-slate-900/80 backdrop-blur transition active:scale-95">
        <span id="feedStatusDot" class="w-2 h-2 rounded-full bg-amber-500 live-pulse"></span>
        <span id="feedStatusText" class="mono">SCANNING…</span>
      </button>

      <!-- Flightwall Fullscreen -->
      <button onclick="toggleFlightwall()" title="Expand to Flightwall Fullscreen"
        class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold mono border border-slate-300/60 dark:border-slate-700/70 bg-white/80 dark:bg-slate-900/80 hover:bg-sky-500/10 transition active:scale-95">
        <svg class="w-3.5 h-3.5 text-sky-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        <span>Flightwall</span>
      </button>

      <!-- Wake Lock Toggle -->
      <button id="wakeLockBtn" onclick="toggleWakeLock()" title="Keep screen awake"
        class="p-2 rounded-full border border-slate-300/60 dark:border-slate-700/70 bg-white/80 dark:bg-slate-900/80 hover:bg-sky-500/10 transition active:scale-95">
        <svg id="wakeLockIcon" class="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>

      <!-- Theme Toggle -->
      <button id="themeToggleBtn" onclick="toggleTheme()" title="Switch Gallery Light / Night Frame"
        class="p-2 rounded-full border border-slate-300/60 dark:border-slate-700/70 bg-white/80 dark:bg-slate-900/80 hover:bg-sky-500/10 transition active:scale-95">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>

      <!-- Settings Drawer Button -->
      <button onclick="toggleSettings(true)" title="Station & Radar Settings"

        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

  <!-- MAIN AMBIENT DISPLAY CANVAS -->

    <div id="mainFrameContainer" class="frame-card w-full h-full rounded-3xl overflow-hidden flex flex-col relative">
      <div id="viewMount" class="w-full h-full flex flex-col overflow-hidden"></div>
    </div>
  </main>

  <nav class="w-full max-w-3xl mx-auto flex flex-wrap items-center justify-center gap-2 z-20">
    <div class="frame-card rounded-2xl p-1.5 flex items-center gap-1 sm:gap-2">
      <button data-view="poster" onclick="switchView('poster')" class="nav-btn px-3.5 sm:px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-1.5">

        <span>Arrivals Board</span>

    </div>

    <!-- Auto-Cycle Kiosk Pill -->
    <button id="kioskBtn" onclick="toggleKioskCycle()"

      <span>Auto-Cycle</span>

  </nav>

  <!-- SETTINGS MODAL DRAWER -->
  <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="frame-card w-full max-w-md rounded-3xl p-6 space-y-5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold">Avioframe Station Settings</h2>
          <p class="text-xs opacity-65">Pick a UK airport, use GPS, or adjust scan range</p>
        </div>
        <button onclick="toggleSettings(false)" class="p-2 rounded-full hover:bg-slate-500/10">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- UK Airport Presets & GPS -->
      <div class="space-y-2">
        <label class="text-xs font-semibold uppercase tracking-wider opacity-70">Quick Airport Presets</label>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="setStationPreset(51.5714, 0.6956, 'Southend-on-Sea', 'EGMC')" class="px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-semibold hover:bg-sky-500/10 transition">
            Southend (EGMC)
          </button>
          <button onclick="setStationPreset(51.4700, -0.4543, 'London Heathrow', 'EGLL')" class="px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-semibold hover:bg-sky-500/10 transition">
            Heathrow (EGLL)
          </button>
          <button onclick="setStationPreset(51.8850, 0.2350, 'London Stansted', 'EGSS')" class="px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-semibold hover:bg-sky-500/10 transition">
            Stansted (EGSS)
          </button>
          <button onclick="setStationPreset(53.3537, -2.2750, 'Manchester', 'EGCC')" class="px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-semibold hover:bg-sky-500/10 transition">
            Manchester (EGCC)
          </button>
        </div>
        <button onclick="useBrowserGeolocation()" class="w-full px-3 py-2.5 rounded-xl bg-sky-600 text-white text-xs font-semibold hover:bg-sky-500 transition">
          Use Device GPS
        </button>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <div>
            <span class="text-[11px] opacity-65">Latitude</span>
            <input id="inputLat" type="number" step="0.0001" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm mono" />
          </div>
          <div>
            <span class="text-[11px] opacity-65">Longitude</span>
            <input id="inputLon" type="number" step="0.0001" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm mono" />
          </div>
        </div>
      </div>

      <!-- Detection Radius -->
      <div class="space-y-2">
        <div class="flex justify-between text-xs font-semibold">
          <span class="uppercase tracking-wider opacity-70">Detection Radius</span>
          <span id="radiusValueLabel" class="mono text-sky-600 dark:text-sky-400">120 km</span>
        </div>
        <input id="inputRadius" type="range" min="25" max="200" step="5" value="120"
          oninput="document.getElementById('radiusValueLabel').textContent = this.value + ' km'"
          class="w-full accent-sky-600" />
      </div>

      <!-- Proximity Chime -->
      <div class="flex items-center justify-between pt-1">
        <div>
          <div class="text-sm font-semibold">Overhead Proximity Chime</div>
          <div class="text-xs opacity-65">Soft chime when a flight passes within 10 km</div>
        </div>
        <input id="inputChime" type="checkbox" class="w-5 h-5 accent-sky-600 rounded" />
      </div>

      <!-- Relay Info -->
      <div class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-[11px] mono text-emerald-600 dark:text-emerald-400">
        RELAY: thebest.stanplayz0612.workers.dev (LIVE ADS-B)
      </div>

      <div class="pt-1 flex gap-2">
        <button onclick="saveSettings()" class="flex-1 py-3 rounded-2xl bg-sky-600 text-white font-semibold text-sm hover:bg-sky-500 transition">
          Save & Scan Live Sky
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST MESSAGE BANNER -->
  <div id="toastBanner" class="fixed bottom-20 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full bg-slate-900 text-white text-xs font-medium shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 border border-white/10"></div>

  <script>
    // =========================================================================
    // 1. CLOUDFLARE RELAY, UK AIRPORT PRESETS & STATE
    // =========================================================================
    const WORKER_URL = 'https://thebest.stanplayz0612.workers.dev/';
    const UK_SCAN = { lat: 52.35, lon: -0.80, dist: 220 };

    const UK_PRESETS = [
      { icao: 'EGMC', name: 'Southend-on-Sea', lat: 51.5714, lon: 0.6956 },
      { icao: 'EGLL', name: 'London Heathrow', lat: 51.4700, lon: -0.4543 },
      { icao: 'EGSS', name: 'London Stansted', lat: 51.8850, lon: 0.2350 },
      { icao: 'EGCC', name: 'Manchester', lat: 53.3537, lon: -2.2750 }
    ];

    const DEFAULT_SETTINGS = {
      lat: 51.5714,
      lon: 0.6956,
      locationName: 'Southend-on-Sea',
      stationIcao: 'EGMC',
      radiusKm: 120,
      theme: 'night',
      chime: false
    };

    const appState = {
      ...DEFAULT_SETTINGS,
      view: 'poster',
      kioskCycle: false,
      flightwall: false,
      wakeLock: null,
      rawScanAircraft: [],
      flights: [],
      selectedIcao: null,
      feedStatus: 'connecting', // 'live' | 'empty' | 'reconnecting' | 'connecting'
      lastSuccessTs: 0,
      isFetching: false
    };

    let bootRetryTimer = null;

    function loadPersistedState() {
      try {
        const saved = JSON.parse(localStorage.getItem('avioframe_gh_settings_v1') || '{}');
        Object.assign(appState, DEFAULT_SETTINGS, saved);
      } catch (_) {}
      applyTheme(appState.theme);
      updateStationHeader();
    }

    function persistSettings() {
      try {
        localStorage.setItem('avioframe_gh_settings_v1', JSON.stringify({
          lat: appState.lat,
          lon: appState.lon,
          locationName: appState.locationName,
          stationIcao: appState.stationIcao,
          radiusKm: appState.radiusKm,
          theme: appState.theme,
          chime: appState.chime
        }));
      } catch (_) {}
    }

    // =========================================================================
    // 2. GEODESIC MATH & TELEMETRY HELPERS
    // =========================================================================
    function toRad(deg) { return (deg * Math.PI) / 180; }
    function toDeg(rad) { return (rad * 180) / Math.PI; }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
      const x =
        Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
        Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function compassSector(deg) {
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return dirs[Math.round(deg / 45) % 8];
    }

    // =========================================================================
    // 3. AIRLINE & AIRCRAFT DECODER + VECTOR LIVERY ENGINE (NO FAKE ROUTES)
    // =========================================================================
    const AIRLINE_DB = {
      // UK & Ireland
      EZY: { name: 'easyJet UK', short: 'EASYJET', primary: '#ff6600', secondary: '#ffffff', tail: '#ff6600' },
      EJU: { name: 'easyJet Europe', short: 'EASYJET', primary: '#ff6600', secondary: '#ffffff', tail: '#ff6600' },
      EZS: { name: 'easyJet Switzerland', short: 'EASYJET', primary: '#ff6600', secondary: '#ffffff', tail: '#ff6600' },
      BAW: { name: 'British Airways', short: 'BRITISH AIRWAYS', primary: '#075aaa', secondary: '#eb2226', tail: '#075aaa' },
      CFE: { name: 'BA CityFlyer', short: 'BA CITYFLYER', primary: '#075aaa', secondary: '#eb2226', tail: '#075aaa' },
      SHT: { name: 'BA Shuttle', short: 'BRITISH AIRWAYS', primary: '#075aaa', secondary: '#eb2226', tail: '#075aaa' },
      EFW: { name: 'BA EuroFlyer', short: 'BA EUROFLYER', primary: '#075aaa', secondary: '#eb2226', tail: '#075aaa' },
      RYR: { name: 'Ryanair', short: 'RYANAIR', primary: '#073590', secondary: '#f1c933', tail: '#073590' },
      RUK: { name: 'Ryanair UK', short: 'RYANAIR UK', primary: '#073590', secondary: '#f1c933', tail: '#073590' },
      RYS: { name: 'Buzz (Ryanair)', short: 'BUZZ', primary: '#f1c933', secondary: '#073590', tail: '#073590' },
      MAY: { name: 'Malta Air (Ryanair)', short: 'MALTA AIR', primary: '#073590', secondary: '#dc2626', tail: '#073590' },
      VIR: { name: 'Virgin Atlantic', short: 'VIRGIN', primary: '#e10a0a', secondary: '#ffffff', tail: '#c80028' },
      EIN: { name: 'Aer Lingus', short: 'AER LINGUS', primary: '#006272', secondary: '#78be20', tail: '#006272' },
      EUK: { name: 'Aer Lingus UK', short: 'AER LINGUS UK', primary: '#006272', secondary: '#78be20', tail: '#006272' },

    function identifyAirline(callsign, extraHints = {}) {
      const clean = (callsign || '').trim().toUpperCase();
      const operatorHint = (extraHints.operatorIcao || '').trim().toUpperCase();
      const ownOpName = (extraHints.ownOpName || '').trim();
      const regCandidate = (extraHints.reg || clean).trim().toUpperCase();

      const prefix3Match = clean.match(/^([A-Z]{3})/);
      const prefix3 = prefix3Match ? prefix3Match[1] : '';
      if (prefix3 && AIRLINE_DB[prefix3]) return AIRLINE_DB[prefix3];
      if (operatorHint && AIRLINE_DB[operatorHint]) return AIRLINE_DB[operatorHint];

      const iataMatch = clean.match(/^([A-Z0-9]{2})\d+/);
      if (iataMatch && IATA_TO_ICAO[iataMatch[1]] && AIRLINE_DB[IATA_TO_ICAO[iataMatch[1]]]) {
        return AIRLINE_DB[IATA_TO_ICAO[iataMatch[1]]];
      }

      if (ownOpName && ownOpName.length > 1) {
        return {
          name: ownOpName,
          short: ownOpName.toUpperCase().slice(0, 20),
          primary: '#0284c7',
          secondary: '#38bdf8',
          tail: '#0369a1'
        };
      }

      for (const entry of REG_COUNTRY_MAP) {
        if (entry.re.test(regCandidate) || entry.re.test(clean)) {
          return {
            name: entry.label,
            short: entry.label.toUpperCase(),
            primary: '#0284c7',
            secondary: '#38bdf8',
            tail: '#0369a1'
          };
        }
      }

      return {
        name: prefix3 ? `Operator ${prefix3}` : 'Live Transponder',
        short: prefix3 || 'AIRCRAFT',
        primary: '#0ea5e9',
        secondary: '#64748b',
        tail: '#0284c7'
      };
    }

          <rect x="288" y="116" width="38" height="17" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2" />
          <rect x="296" y="116" width="22" height="17" fill="${primary}" />

    // =========================================================================
    // 4. CLOUDFLARE WORKER LIVE FEED + INSTANT AIRPORT SWITCHING
    // =========================================================================
    let lastChimedIcao = null;

    function rebuildFlightsForStation() {
      const mapped = appState.rawScanAircraft
        .map(ac => {
          const distKm = haversineKm(appState.lat, appState.lon, ac.lat, ac.lon);
          const bearing = calculateBearing(appState.lat, appState.lon, ac.lat, ac.lon);
          const altFeet = typeof ac.alt_baro === 'number'
            ? Math.round(ac.alt_baro)
            : (typeof ac.alt_geom === 'number' ? Math.round(ac.alt_geom) : 0);
          const altMeters = Math.round(altFeet * 0.3048);
          const speedKnots = Math.round(Number(ac.gs) || 0);
          const speedKmh = Math.round(speedKnots * 1.852);
          const velocityMs = speedKnots * 0.514444;
          const baroRateFpm = Number(ac.baro_rate || ac.geom_rate || 0);
          const callsign = (ac.flight || ac.r || ac.hex || 'UNKNOWN').trim().toUpperCase();
          const reg = (ac.r || '').trim().toUpperCase();
          const typeCode = (ac.t || '').trim().toUpperCase();
          const airline = identifyAirline(callsign, {
            operatorIcao: ac.opIcao || '',
            ownOpName: ac.ownOp || '',
            reg
          });

          return {
            icao24: String(ac.hex || callsign).toLowerCase(),
            callsign,
            reg,
            typeCode,
            modelName: decodeAircraftModel(typeCode, ac.desc),
            airline,
            lat: ac.lat,
            lon: ac.lon,
            distKm,
            bearing,
            sector: compassSector(bearing),
            altFeet,
            altMeters,
            speedKnots,
            speedKmh,
            velocityMs,
            heading: Number(ac.track) || 0,
            verticalRateFpm: baroRateFpm,
            squawk: String(ac.squawk || ''),
            stationCode: appState.stationIcao || 'RX',
            stationCity: appState.locationName
          };
        })
        .sort((a, b) => a.distKm - b.distKm);

      const withinRadius = mapped.filter(f => f.distKm <= appState.radiusKm);
      appState.flights = withinRadius.slice(0, 24);
      appState.feedStatus = appState.flights.length > 0 ? 'live' : 'empty';

      if (!appState.selectedIcao || !appState.flights.some(f => f.icao24 === appState.selectedIcao)) {
        appState.selectedIcao = appState.flights[0]?.icao24 || null;
      }

      // Proximity chime check
      if (appState.chime && appState.flights.length > 0) {
        const closest = appState.flights[0];
        if (closest.distKm <= 10 && lastChimedIcao !== closest.icao24) {
          lastChimedIcao = closest.icao24;
          playProximityChime();
        }
      }

      updateFeedStatusUI();
      renderActiveView();
    }

    async function fetchLiveAirspace(manual = false) {
      if (appState.isFetching) return;
      appState.isFetching = true;
      if (bootRetryTimer) clearTimeout(bootRetryTimer);

      if (appState.rawScanAircraft.length === 0 || manual) {
        updateFeedStatusUI('connecting');
      }

      // Use single wide UK scan for UK airports (instant switching!), or custom station if outside UK
      const distFromUkCenter = haversineKm(appState.lat, appState.lon, UK_SCAN.lat, UK_SCAN.lon);
      const useUkScan = distFromUkCenter <= 250;
      const scanLat = useUkScan ? UK_SCAN.lat : appState.lat;
      const scanLon = useUkScan ? UK_SCAN.lon : appState.lon;
      const scanDistNm = useUkScan ? UK_SCAN.dist : Math.min(220, Math.max(40, Math.round(appState.radiusKm * 0.54)));

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);

      try {
        const url = `${WORKER_URL}?lat=${scanLat.toFixed(4)}&lon=${scanLon.toFixed(4)}&dist=${scanDistNm}&_t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const rawList = (data.ac || data.aircraft || []).filter(
          a => Number.isFinite(a.lat) && Number.isFinite(a.lon) && a.alt_baro !== 'ground'
        );

        if (rawList.length > 0) {
          appState.rawScanAircraft = rawList;
          appState.lastSuccessTs = Date.now();
          rebuildFlightsForStation();
        } else if (appState.rawScanAircraft.length === 0) {
          appState.feedStatus = 'connecting';
          updateFeedStatusUI('connecting');
          bootRetryTimer = setTimeout(() => fetchLiveAirspace(false), 5000);
        } else {
          rebuildFlightsForStation();
        }
      } catch (_) {
        clearTimeout(timeoutId);
        if (appState.flights.length > 0 && (Date.now() - appState.lastSuccessTs) < 60000) {
          updateFeedStatusUI('reconnecting');
        } else {
          appState.feedStatus = 'connecting';
          updateFeedStatusUI('connecting');
          bootRetryTimer = setTimeout(() => fetchLiveAirspace(false), 5000);
        }
      } finally {
        appState.isFetching = false;
      }
    }

    // 1-Second Smooth Kinematics (glides aircraft smoothly between 20s radar polls)
    function tickOneSecondKinematics() {
      if (appState.flights.length === 0) return;

      for (const f of appState.flights) {
        if (f.velocityMs > 5) {
          const hRad = toRad(f.heading);
          const dLat = (f.velocityMs * Math.cos(hRad)) / 111320;
          const dLon = (f.velocityMs * Math.sin(hRad)) / (111320 * Math.cos(toRad(f.lat)));
          f.lat += dLat;
          f.lon += dLon;
          f.distKm = haversineKm(appState.lat, appState.lon, f.lat, f.lon);
          f.bearing = calculateBearing(appState.lat, appState.lon, f.lat, f.lon);
          f.sector = compassSector(f.bearing);
        }
        if (f.verticalRateFpm !== 0) {
          f.altFeet = Math.max(500, Math.min(45000, Math.round(f.altFeet + f.verticalRateFpm / 60)));
          f.altMeters = Math.round(f.altFeet * 0.3048);
        }
      }

      // Smooth in-place update on Poster view (no DOM flicker)
      if (appState.view === 'poster') {
        const active = appState.flights.find(f => f.icao24 === appState.selectedIcao) || appState.flights[0];
        if (active) {
          const setEl = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
          setEl('poster-dist', active.distKm.toFixed(1));
          setEl('poster-brg', `Bearing ${Math.round(active.bearing)}° (${active.sector})`);
          setEl('poster-alt-m', `${active.altMeters.toLocaleString()} m`);
          setEl('poster-alt-ft', `${active.altFeet.toLocaleString()} ft`);
        }
      }
    }

    function playProximityChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.62);
      } catch (_) {}
    }

    function startRadarLoop() {
      if (radarAnimId) cancelAnimationFrame(radarAnimId);
      const canvas = document.getElementById('atcRadarCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const maxR = Math.min(cx, cy) - 24;
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        let closest = null;
        let bestPx = 28;
        for (const f of appState.flights) {
          const r = (f.distKm / appState.radiusKm) * maxR;
          const rad = toRad(f.bearing - 90);
          const bx = cx + Math.cos(rad) * r;
          const by = cy + Math.sin(rad) * r;
          const d = Math.hypot(clickX - bx, clickY - by);
          if (d < bestPx) {
            bestPx = d;
            closest = f;
          }
        }
        if (closest) selectAircraft(closest.icao24);
      };

      function draw() {
        if (appState.view !== 'radar' || !document.getElementById('atcRadarCanvas')) return;
        const wrap = document.getElementById('radarCanvasWrap');
        const dpr = window.devicePixelRatio || 1;
        const w = wrap.clientWidth;
        const h = wrap.clientHeight;
        if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const cx = w / 2;
        const cy = h / 2;
        const maxR = Math.max(40, Math.min(cx, cy) - 24);

        ctx.fillStyle = '#060d0a';
        ctx.fillRect(0, 0, w, h);

        // Concentric range rings
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.22)';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 3; i++) {
          ctx.beginPath();
          ctx.arc(cx, cy, (maxR / 3) * i, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Crosshairs
        ctx.beginPath();
        ctx.moveTo(cx - maxR, cy);
        ctx.lineTo(cx + maxR, cy);
        ctx.moveTo(cx, cy - maxR);
        ctx.lineTo(cx, cy + maxR);
        ctx.stroke();

        // Center airfield marker
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx - 4, cy - 4, 8, 8);
        ctx.font = '700 10px "JetBrains Mono", monospace';
        ctx.fillStyle = '#f59e0b';
        ctx.fillText(appState.stationIcao, cx + 8, cy + 3);

        // Rotating sweep wedge
        radarSweepAngle = (radarSweepAngle + 0.022) % (Math.PI * 2);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(radarSweepAngle);
        const sweepGrad = ctx.createLinearGradient(0, 0, maxR, 0);
        sweepGrad.addColorStop(0, 'rgba(16, 185, 129, 0.28)');
        sweepGrad.addColorStop(1, 'rgba(16, 185, 129, 0.02)');
        ctx.fillStyle = sweepGrad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, maxR, -0.35, 0);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(maxR, 0);
        ctx.stroke();
        ctx.restore();

        // Aircraft blips
        for (const f of appState.flights) {
          const r = Math.min(maxR, (f.distKm / appState.radiusKm) * maxR);
          const rad = toRad(f.bearing - 90);
          const bx = cx + Math.cos(rad) * r;
          const by = cy + Math.sin(rad) * r;
          const isSel = f.icao24 === appState.selectedIcao;

          const hRad = toRad(f.heading - 90);
          ctx.strokeStyle = isSel ? '#fde047' : '#34d399';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + Math.cos(hRad) * 14, by + Math.sin(hRad) * 14);
          ctx.stroke();

          ctx.fillStyle = isSel ? '#fde047' : '#10b981';
          ctx.beginPath();
          ctx.arc(bx, by, isSel ? 5 : 3.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.font = '600 10px "JetBrains Mono", monospace';
          ctx.fillStyle = isSel ? '#fef08a' : 'rgba(167, 243, 208, 0.9)';
          ctx.fillText(`${f.callsign} ${Math.round(f.altFeet / 100)}`, bx + 7, by - 4);
        }

        radarAnimId = requestAnimationFrame(draw);
      }
      radarAnimId = requestAnimationFrame(draw);
    }

    // VIEW 3: MECHANICAL SPLIT-FLAP OVERHEAD BOARD
    function renderBoardView(mount) {
      if (appState.flights.length === 0) {
        renderWaitingOrEmptyCard(mount);
        return;
      }

      mount.innerHTML = `
        <div class="w-full h-full bg-[#11151c] text-slate-100 p-5 sm:p-8 flex flex-col overflow-hidden">
          <div class="flex items-center justify-between pb-4 border-b border-slate-800">
            <div>
              <div class="text-xs uppercase tracking-widest text-amber-400 font-bold mono">OVERHEAD SECTOR LIVE TRAFFIC</div>
              <h2 class="text-xl sm:text-2xl font-bold tracking-tight mt-0.5">${appState.locationName.toUpperCase()} (${appState.stationIcao})</h2>
            </div>
            <div class="text-right mono text-xs text-slate-400">
              <div>${appState.flights.length} LIVE FLIGHTS</div>
              <div>LIVE ADS-B RELAY</div>
            </div>
          </div>

          <div class="grid grid-cols-12 gap-2 text-[11px] font-bold uppercase tracking-wider text-slate-400 py-3 px-2 mono">
            <div class="col-span-3">FLIGHT</div>
            <div class="col-span-4">OPERATOR / TYPE</div>
            <div class="col-span-2">HDG / SPD</div>
            <div class="col-span-3 text-right">DIST / ALT</div>
          </div>

          <div class="flex-1 overflow-y-auto space-y-2 pr-1">
            ${appState.flights.map(f => `
              <button onclick="selectAircraft('${f.icao24}'); switchView('poster');"
                class="w-full grid grid-cols-12 gap-2 items-center p-2.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-800/80 text-left transition">
                <div class="col-span-3">
                  <span class="flap-tile inline-block px-2 py-1 text-xs sm:text-sm font-bold text-amber-300">${f.callsign}</span>
                </div>
                <div class="col-span-4 truncate">
                  <div class="text-xs sm:text-sm font-semibold text-slate-200 truncate">${f.airline.name}</div>
                  <div class="text-[11px] text-slate-400 truncate">${f.modelName}</div>
                </div>
                <div class="col-span-2 mono text-xs text-sky-400 font-bold">
                  <div>${Math.round(f.heading)}°</div>
                  <div class="text-[11px] text-slate-400">${f.speedKnots} kt</div>
                </div>
                <div class="col-span-3 text-right mono text-xs">
                  <div class="font-bold text-emerald-400">${f.distKm.toFixed(1)} km</div>
                  <div class="text-[11px] text-slate-400">${f.altFeet.toLocaleString()} ft</div>
                </div>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 6. UI CONTROLS, FLIGHTWALL, AIRPORT CYCLER, KIOSK & WAKE LOCK
    // =========================================================================
    function selectAircraft(icao24) {
      appState.selectedIcao = icao24;
      renderActiveView();
    }

    function cycleAirport() {
      const idx = UK_PRESETS.findIndex(p => p.icao === appState.stationIcao);
      const next = UK_PRESETS[(idx + 1) % UK_PRESETS.length];
      appState.lat = next.lat;
      appState.lon = next.lon;
      appState.locationName = next.name;
      appState.stationIcao = next.icao;
      appState.selectedIcao = null;
      persistSettings();
      updateStationHeader();
      showToast(`Switched to ${next.name} (${next.icao})`);

      if (appState.rawScanAircraft.length > 0) {
        rebuildFlightsForStation();
      } else {
        renderActiveView();
        fetchLiveAirspace(true);
      }
    }

    function updateStationHeader() {
      const text = document.getElementById('stationBadgeText');
      if (text) {
        text.textContent = `${appState.locationName.toUpperCase()} (${appState.stationIcao})`;
      }
    }

    function updateFeedStatusUI(overrideState) {
      const state = overrideState || appState.feedStatus;
      const dot = document.getElementById('feedStatusDot');
      const text = document.getElementById('feedStatusText');
      const sub = document.getElementById('statusSubline');
      if (!dot || !text || !sub) return;

      dot.className = 'w-2 h-2 rounded-full live-pulse';
      if (state === 'live') {
        dot.classList.add('bg-emerald-500');
        text.textContent = `${appState.stationIcao} LIVE • ${appState.flights.length} ACFT`;
        sub.textContent = `Tracking ${appState.flights.length} live aircraft within ${appState.radiusKm} km of ${appState.locationName}`;
      } else if (state === 'empty') {
        dot.classList.add('bg-sky-500');
        text.textContent = `${appState.stationIcao} LIVE • 0 ACFT`;
        sub.textContent = `Connected to live ADS-B • Clear skies within ${appState.radiusKm} km`;
      } else if (state === 'reconnecting') {
        dot.classList.add('bg-amber-500');
        text.textContent = 'RECONNECTING…';
        sub.textContent = 'Holding live transponder tracks…';
      } else {
        dot.classList.add('bg-amber-500');
        text.textContent = `SYNCING ${appState.stationIcao}…`;
        sub.textContent = `Scanning live ADS-B radar around ${appState.locationName}…`;
      }
    }

    function applyTheme(theme) {
      appState.theme = theme;
      const isNight = theme === 'night';
      document.body.classList.toggle('theme-gallery', !isNight);
      document.body.classList.toggle('theme-night', isNight);
      document.documentElement.classList.toggle('dark', isNight);
    }

    function toggleTheme() {
      applyTheme(appState.theme === 'gallery' ? 'night' : 'gallery');
      persistSettings();
      showToast(appState.theme === 'gallery' ? 'Gallery Light Frame' : 'Night Cockpit Frame');
    }

    function toggleFlightwall() {
      if (appState.view !== 'poster') switchView('poster');
      appState.flightwall = !appState.flightwall;
      document.body.classList.toggle('flightwall-mode', appState.flightwall);
      document.getElementById('flightwallExitBtn').classList.toggle('hidden', !appState.flightwall);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && appState.flightwall) toggleFlightwall();
    });

    let kioskTimer = null;
    function toggleKioskCycle() {
      appState.kioskCycle = !appState.kioskCycle;
      const ind = document.getElementById('kioskIndicator');
      if (ind) {
        ind.className = `w-2 h-2 rounded-full ${appState.kioskCycle ? 'bg-emerald-500 live-pulse' : 'bg-slate-400'}`;
      }
      if (kioskTimer) clearInterval(kioskTimer);
      if (appState.kioskCycle) {
        const order = ['poster', 'radar', 'board'];
        kioskTimer = setInterval(() => {
          const next = order[(order.indexOf(appState.view) + 1) % order.length];
          switchView(next);
        }, 20000);
        showToast('Auto-Cycle enabled (20s per view)');
      } else {
        showToast('Auto-Cycle paused');
      }
    }

    async function toggleWakeLock() {
      const icon = document.getElementById('wakeLockIcon');
      try {
        if (!appState.wakeLock && 'wakeLock' in navigator) {
          appState.wakeLock = await navigator.wakeLock.request('screen');
          icon?.classList.remove('opacity-70');
          icon?.classList.add('text-amber-500');
          showToast('Screen Wake Lock active');
        } else if (appState.wakeLock) {
          await appState.wakeLock.release();
          appState.wakeLock = null;
          icon?.classList.add('opacity-70');
          icon?.classList.remove('text-amber-500');
          showToast('Screen Wake Lock released');
        } else {
          showToast('Wake Lock not supported on this browser');
        }
      } catch (_) {
        showToast('Unable to acquire Wake Lock');
      }
    }

    function toggleSettings(open) {
      const modal = document.getElementById('settingsModal');
      if (!modal) return;
      if (open) {
        document.getElementById('inputLat').value = appState.lat;
        document.getElementById('inputLon').value = appState.lon;
        document.getElementById('inputRadius').value = appState.radiusKm;
        document.getElementById('radiusValueLabel').textContent = `${appState.radiusKm} km`;
        document.getElementById('inputChime').checked = appState.chime;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function setStationPreset(lat, lon, name, icao) {
      document.getElementById('inputLat').value = lat;
      document.getElementById('inputLon').value = lon;
      appState.locationName = name;
      appState.stationIcao = icao;
      showToast(`Selected ${name} (${icao})`);
    }

    function useBrowserGeolocation() {
      if (!('geolocation' in navigator)) {
        showToast('Geolocation unavailable on this device');
        return;
      }
      showToast('Requesting GPS fix…');
      navigator.geolocation.getCurrentPosition(
        pos => {
          document.getElementById('inputLat').value = pos.coords.latitude.toFixed(4);
          document.getElementById('inputLon').value = pos.coords.longitude.toFixed(4);
          appState.locationName = 'My GPS';
          appState.stationIcao = 'GPS';
          showToast('GPS coordinates updated');
        },
        () => showToast('GPS permission denied — keeping current station'),
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    function saveSettings() {
      const lat = parseFloat(document.getElementById('inputLat').value);
      const lon = parseFloat(document.getElementById('inputLon').value);
      const radius = parseInt(document.getElementById('inputRadius').value, 10);
      if (Number.isFinite(lat) && Number.isFinite(lon)) {
        appState.lat = lat;
        appState.lon = lon;
      }
      if (Number.isFinite(radius)) appState.radiusKm = radius;
      appState.chime = document.getElementById('inputChime').checked;
      persistSettings();
      updateStationHeader();
      toggleSettings(false);
      if (appState.rawScanAircraft.length > 0 && haversineKm(appState.lat, appState.lon, UK_SCAN.lat, UK_SCAN.lon) <= 250) {
        rebuildFlightsForStation();
      } else {
        fetchLiveAirspace(true);
      }
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('opacity-0');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('opacity-0'), 2800);
    }

    // =========================================================================
    // 7. BOOTSTRAP
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadPersistedState();
      switchView('poster');
      fetchLiveAirspace(false);
      setInterval(tickOneSecondKinematics, 1000);
      setInterval(() => fetchLiveAirspace(false), 20000);
    });
  </script>
</body>
