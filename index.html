<script>
    const LOCATIONS = [
      { label: 'Southend-on-Sea, UK (EGMC) • 45 km', icao: 'EGMC', lat: 51.5714, lon: 0.6956 },
      { label: 'London Heathrow, UK (EGLL) • 45 km', icao: 'EGLL', lat: 51.4700, lon: -0.4543 },
      { label: 'London Stansted, UK (EGSS) • 45 km', icao: 'EGSS', lat: 51.8850, lon: 0.2350 },
      { label: 'Manchester, UK (EGCC) • 45 km', icao: 'EGCC', lat: 53.3537, lon: -2.2750 }
    ];
    let currentLocationIdx = 0;

    const FALLBACK_FLEET = [
      { id: 'ac5', icao: 'EZY', callsign: 'EZY73EB', airline: 'easyJet', type: 'Airbus A319-100', reg: 'G-EZAX', origin: 'SEN', dest: 'AMS', altFt: 9800, vrate: 1450, spdKts: 265, distKm: 23.7, bearingDeg: 88, bearingCard: 'E', track: 84, squawk: '7341', tailColor: '#ea580c', stripeColor: '#fb923c', xKm: 23.6, yKm: 0.8 },
      { id: 'ac1', icao: 'LGL', callsign: 'LGL4L', airline: 'Luxair', type: 'De Havilland Dash 8-400', reg: 'LX-LQA', origin: 'LCY', dest: 'LUX', altFt: 12950, vrate: 192, spdKts: 282, distKm: 17.0, bearingDeg: 195, bearingCard: 'SSW', track: 129, squawk: '4412', tailColor: '#0ea5e9', stripeColor: '#38bdf8', xKm: -4.4, yKm: -16.4 },
      { id: 'ac2', icao: 'TAM', callsign: 'TAM8079', airline: 'LATAM Airlines', type: 'Boeing 777-300ER', reg: 'PT-MUA', origin: 'LHR', dest: 'GRU', altFt: 31000, vrate: 0, spdKts: 472, distKm: 17.2, bearingDeg: 220, bearingCard: 'SW', track: 215, squawk: '6201', tailColor: '#dc2626', stripeColor: '#1e3a8a', xKm: -11.0, yKm: -13.2 },
      { id: 'ac3', icao: 'SAS', callsign: 'SAS70Y', airline: 'Scandinavian Airlines', type: 'Airbus A320neo', reg: 'SE-ROA', origin: 'ARN', dest: 'LHR', altFt: 18400, vrate: -850, spdKts: 340, distKm: 20.5, bearingDeg: 45, bearingCard: 'NE', track: 242, squawk: '1420', tailColor: '#1d4ed8', stripeColor: '#60a5fa', xKm: 14.5, yKm: 14.5 },
      { id: 'ac4', icao: 'RYR', callsign: 'RYR5TJ', airline: 'Ryanair', type: 'Boeing 737-800', reg: 'EI-DCL', origin: 'STN', dest: 'ALC', altFt: 24100, vrate: 1120, spdKts: 398, distKm: 23.4, bearingDeg: 285, bearingCard: 'WNW', track: 168, squawk: '5211', tailColor: '#1e40af', stripeColor: '#facc15', xKm: -22.6, yKm: 6.1 },
      { id: 'ac6', icao: 'BAW', callsign: 'BAW447X', airline: 'British Airways', type: 'Airbus A320neo', reg: 'G-TTNI', origin: 'AMS', dest: 'LHR', altFt: 13120, vrate: -640, spdKts: 339, distKm: 15.8, bearingDeg: 4, bearingCard: 'N', track: 268, squawk: '3104', tailColor: '#1e3a8a', stripeColor: '#dc2626', xKm: 1.1, yKm: 15.7 },
      { id: 'ac7', icao: 'BEL', callsign: 'BEL5BJ', airline: 'Brussels Airlines', type: 'Airbus A319-100', reg: 'OO-SSV', origin: 'BRU', dest: 'MAN', altFt: 33975, vrate: 0, spdKts: 384, distKm: 15.8, bearingDeg: 95, bearingCard: 'E', track: 293, squawk: '2215', tailColor: '#1d4ed8', stripeColor: '#ef4444', xKm: 15.7, yKm: -1.4 },
      { id: 'ac8', icao: 'KLM', callsign: 'KLM49W', airline: 'KLM Royal Dutch', type: 'Embraer E195-E2', reg: 'PH-NXL', origin: 'AMS', dest: 'BHX', altFt: 32000, vrate: 0, spdKts: 425, distKm: 16.4, bearingDeg: 112, bearingCard: 'ESE', track: 267, squawk: '2140', tailColor: '#0284c7', stripeColor: '#38bdf8', xKm: 15.2, yKm: -6.1 }
    ];

    let aircraftList = JSON.parse(JSON.stringify(FALLBACK_FLEET));
    let selectedId = 'ac5';
    let liveSim = true;
    let isLight = false;
    let soundOn = false;
    let isFlightwall = false;
    let currentView = 'poster';
    let spottedLogs = JSON.parse(localStorage.getItem('avioframe_spotter_logs') || '[]');

    function toggleFlightwall() {
      if (currentView !== 'poster') switchView('poster');
      isFlightwall = !isFlightwall;
      document.body.classList.toggle('flightwall-mode', isFlightwall);
      document.getElementById('flightwall-exit-btn').classList.toggle('hidden', !isFlightwall);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isFlightwall) toggleFlightwall();
    });

    function getCardinal(deg) {
      const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      return dirs[Math.round(((deg % 360) / 22.5)) % 16];
    }

    function airlineBranding(callsign) {
      const prefix = (callsign || '').slice(0, 3).toUpperCase();
      const map = {
        BAW: { airline: 'British Airways', tail: '#1e3a8a', stripe: '#dc2626' },
        EZY: { airline: 'easyJet', tail: '#ea580c', stripe: '#fb923c' },
        RYR: { airline: 'Ryanair', tail: '#1e40af', stripe: '#facc15' },
        VIR: { airline: 'Virgin Atlantic', tail: '#dc2626', stripe: '#991b1b' },
        KLM: { airline: 'KLM Royal Dutch', tail: '#0284c7', stripe: '#38bdf8' },
        DLH: { airline: 'Lufthansa', tail: '#0f172a', stripe: '#eab308' },
        AFR: { airline: 'Air France', tail: '#1e3a8a', stripe: '#ef4444' },
        UAE: { airline: 'Emirates', tail: '#dc2626', stripe: '#b45309' },
        SAS: { airline: 'Scandinavian Airlines', tail: '#1d4ed8', stripe: '#60a5fa' },
        LGL: { airline: 'Luxair', tail: '#0ea5e9', stripe: '#38bdf8' },
        BEL: { airline: 'Brussels Airlines', tail: '#1d4ed8', stripe: '#ef4444' },
        WZZ: { airline: 'Wizz Air', tail: '#c026d3', stripe: '#ec4899' },
        TOM: { airline: 'TUI Airways', tail: '#0284c7', stripe: '#ef4444' },
        EIN: { airline: 'Aer Lingus', tail: '#059669', stripe: '#34d399' },
        SWR: { airline: 'SWISS', tail: '#dc2626', stripe: '#f8fafc' },
        AAL: { airline: 'American Airlines', tail: '#1d4ed8', stripe: '#dc2626' },
        DAL: { airline: 'Delta Air Lines', tail: '#1e3a8a', stripe: '#dc2626' },
        UAL: { airline: 'United Airlines', tail: '#1d4ed8', stripe: '#38bdf8' }
      };
      return map[prefix] || { airline: `Operator (${prefix || 'ADS-B'})`, tail: '#0ea5e9', stripe: '#38bdf8' };
    }

    async function fetchLiveADSB(manual = false) {
      const loc = LOCATIONS[currentLocationIdx];
      const badge = document.getElementById('feed-source-badge');
      if (manual) {
        badge.innerHTML = `SYNCING LIVE ADS-B...`;
      }

      const endpoints = [
        `https://api.airplanes.live/v2/point/${loc.lat}/${loc.lon}/45`,
        `https://api.adsb.lol/v2/point/${loc.lat}/${loc.lon}/45`,
        `https://corsproxy.io/?${encodeURIComponent(`https://api.airplanes.live/v2/point/${loc.lat}/${loc.lon}/45`)}`
      ];

      for (const url of endpoints) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
          clearTimeout(timer);
          if (!res.ok) continue;

          const data = await res.json();
          const rawList = data.ac || data.aircraft || [];

          if (Array.isArray(rawList) && rawList.length > 0) {
            const liveParsed = rawList
              .filter(a => typeof a.lat === 'number' && typeof a.lon === 'number' && a.alt_baro !== 'ground')
              .slice(0, 16)
              .map((a, idx) => {
                const callsign = (a.flight || a.r || a.hex || 'UNKN').trim();
                const brand = airlineBranding(callsign);
                const dLat = (a.lat - loc.lat) * 111.32;
                const dLon = (a.lon - loc.lon) * 111.32 * Math.cos(loc.lat * Math.PI / 180);
                const distKm = Math.max(0.8, Math.sqrt(dLat * dLat + dLon * dLon));
                const brg = (Math.atan2(dLon, dLat) * 180 / Math.PI + 360) % 360;

                return {
                  id: a.hex || `live_${idx}`,
                  icao: callsign.slice(0, 3) || 'ADS',
                  callsign,
                  airline: brand.airline,
                  type: a.desc || (a.t ? `ICAO Type ${a.t}` : 'Commercial Airliner'),
                  reg: a.r || (a.hex ? a.hex.toUpperCase() : 'N/A'),
                  origin: loc.icao,
                  dest: 'LIVE',
                  altFt: typeof a.alt_baro === 'number' ? a.alt_baro : 15000,
                  vrate: a.baro_rate || a.geom_rate || 0,
                  spdKts: Math.round(a.gs || 320),
                  distKm: +distKm.toFixed(1),
                  bearingDeg: Math.round(brg),
                  bearingCard: getCardinal(brg),
                  track: Math.round(a.track || 90),
                  squawk: a.squawk || '----',
                  tailColor: brand.tail,
                  stripeColor: brand.stripe,
                  xKm: dLon,
                  yKm: dLat
                };
              });

            if (liveParsed.length > 0) {
              const customOnes = aircraftList.filter(a => String(a.id).startsWith('custom_'));
              aircraftList = [...customOnes, ...liveParsed];
              if (!aircraftList.some(a => a.id === selectedId)) selectedId = aircraftList[0].id;
              badge.innerHTML = `LIVE • ADS-B REAL • <span id="header-acft-count" class="ml-1">${aircraftList.length} ACFT</span>`;
              document.getElementById('board-source-label').textContent = 'SOURCE: REAL LIVE ADS-B + 1S KINEMATIC TRACKER';
              updateAllViews();
              return;
            }
          }
        } catch (e) {
          // Try next live ADS-B endpoint
        }
      }

      badge.innerHTML = `SIM • ADS-B • <span id="header-acft-count" class="ml-1">${aircraftList.length} ACFT</span>`;
      if (manual) updateAllViews();
    }

    function tickOneSecondKinematics() {
      if (!liveSim) return;
      aircraftList.forEach(ac => {
        const kmPerSec = (ac.spdKts * 1.852) / 3600;
        const trackRad = (ac.track * Math.PI) / 180;
        ac.xKm += Math.sin(trackRad) * kmPerSec;
        ac.yKm += Math.cos(trackRad) * kmPerSec;
        const dist = Math.sqrt(ac.xKm * ac.xKm + ac.yKm * ac.yKm);
        if (dist > 44) ac.track = (ac.track + 180) % 360;
        ac.distKm = Math.max(0.5, +dist.toFixed(1));
        const brg = (Math.atan2(ac.xKm, ac.yKm) * 180 / Math.PI + 360) % 360;
        ac.bearingDeg = Math.round(brg);
        ac.bearingCard = getCardinal(brg);
        if (ac.vrate !== 0) {
          ac.altFt = Math.max(1200, Math.min(43000, Math.round(ac.altFt + ac.vrate / 60)));
        }
      });
      updateAllViews();
    }

    function updateAllViews() {
      renderPoster();
      if (currentView === 'radar') renderRadar();
      if (currentView === 'board') renderBoard();
    }

    function renderCleanSideProfile(tailColor = '#ea580c', stripeColor = '#fb923c') {
      let dots = '';
      for (let x = 108; x <= 298; x += 9) {
        dots += `<circle cx="${x}" cy="58" r="1.6" fill="#1e293b"/>`;
      }
      return `
        <svg viewBox="0 0 380 105" class="w-full h-auto drop-shadow-lg" xmlns="http://www.w3.org/2000/svg">
          <path d="M 48 52 L 32 14 L 58 14 L 85 52 Z" fill="${tailColor}"/>
          <path d="M 32 63 L 16 58 L 22 66 L 45 67 Z" fill="#94a3b8"/>
          <path d="M 44 63 C 44 53, 66 47, 96 47 L 302 47 C 332 47, 355 58, 362 65 C 364 67, 361 71, 354 71 L 90 71 C 62 71, 44 68, 44 63 Z" fill="#f8fafc"/>
          <path d="M 52 65 L 357 65 C 359 68, 357 71, 352 71 L 90 71 C 66 71, 55 68, 52 65 Z" fill="${stripeColor}"/>
          <path d="M 325 52 L 341 53 L 347 58 L 325 58 Z" fill="#0f172a"/>
          ${dots}
          <path d="M 178 65 L 136 78 L 154 78 L 214 65 Z" fill="#cbd5e1"/>
          <rect x="195" y="69" width="28" height="10" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
          <rect x="195" y="69" width="6" height="10" rx="2" fill="${tailColor}"/>
          <rect x="219" y="69" width="4" height="10" rx="1" fill="#334155"/>
        </svg>
      `;
    }

    function switchView(viewName) {
      currentView = viewName;
      ['poster', 'radar', 'board', 'spotter'].forEach(v => {
        document.getElementById(`view-${v}`).classList.toggle('hidden', v !== viewName);
        const btn = document.getElementById(`nav-${v}`);
        btn.className = v === viewName
          ? "flex-1 py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center space-x-1.5 bg-white text-slate-950 shadow transition"
          : "flex-1 py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 text-slate-400 hover:text-white transition";
      });
      if (viewName === 'radar') renderRadar();
      if (viewName === 'board') renderBoard();
      if (viewName === 'spotter') renderSpotterLogs();
    }

    function selectAircraft(id, goToPoster = false) {
      selectedId = id;
      updateAllViews();
      if (goToPoster) switchView('poster');
    }

    function renderPoster() {
      const sorted = [...aircraftList].sort((a, b) => a.distKm - b.distKm);
      const active = sorted.find(a => a.id === selectedId) || sorted[0];
      selectedId = active.id;

      const countEl = document.getElementById('header-acft-count');
      if (countEl) countEl.textContent = `${aircraftList.length} ACFT`;

      document.getElementById('poster-icao-pill').textContent = active.icao;
      document.getElementById('poster-vspeed-pill').textContent = active.vrate > 100
        ? `CLIMBING • +${active.vrate} ft/min`
        : active.vrate < -100
          ? `DESCENDING • ${active.vrate} ft/min`
          : `CRUISING • LEVEL`;

      document.getElementById('poster-callsign').textContent = active.callsign;
      document.getElementById('poster-subtitle').innerHTML = `${active.type} • Reg <span class="text-slate-200 font-semibold">${active.reg}</span>`;

      document.getElementById('poster-origin').textContent = active.origin;
      document.getElementById('poster-dest').textContent = active.dest;
      document.getElementById('poster-route-dist').textContent = `${active.distKm.toFixed(1)} KM AWAY`;

      document.getElementById('poster-plane-svg').innerHTML = renderCleanSideProfile(active.tailColor, active.stripeColor);

      document.getElementById('fw-alt').textContent = `${active.altFt.toLocaleString()} ft`;
      document.getElementById('fw-spd').textContent = `${active.spdKts} kts`;
      document.getElementById('fw-hdg').textContent = `${String(active.track).padStart(3, '0')}° ${active.bearingCard}`;
      document.getElementById('fw-loc').textContent = LOCATIONS[currentLocationIdx].icao;

      document.getElementById('nearby-pills-grid').innerHTML = sorted.slice(0, 8).map(ac => {
        const isSelected = ac.id === active.id;
        return `
          <button onclick="selectAircraft('${ac.id}')" class="px-3 py-2 rounded-full font-mono text-xs flex items-center justify-between transition ${isSelected ? 'bg-white text-slate-950 font-extrabold shadow' : 'bg-[#161d2c] text-slate-300 border border-[#232d42] hover:border-slate-500'}">
            <span>${ac.callsign}</span>
            <span class="${isSelected ? 'text-slate-600' : 'text-slate-400'}">${ac.distKm.toFixed(1)}km</span>
          </button>
        `;
      }).join('');

      document.getElementById('tele-alt-m').textContent = Math.round(active.altFt * 0.3048).toLocaleString();
      document.getElementById('tele-alt-ft').textContent = active.altFt.toLocaleString();
      document.getElementById('tele-spd-kmh').textContent = Math.round(active.spdKts * 1.852);
      document.getElementById('tele-spd-kts').textContent = active.spdKts;
      document.getElementById('tele-dist-km').textContent = active.distKm.toFixed(1);
      document.getElementById('tele-dist-nm').textContent = `${(active.distKm * 0.539957).toFixed(1)} nm •`;
      document.getElementById('tele-bearing').textContent = `${active.bearingDeg}° ${active.bearingCard}`;
      document.getElementById('tele-track').textContent = `${active.track}°`;
      document.getElementById('tele-squawk').textContent = active.squawk;
    }

    function renderRadar() {
      const layer = document.getElementById('radar-targets-layer');
      const active = aircraftList.find(a => a.id === selectedId) || aircraftList[0];

      document.getElementById('radar-tracks-badge').textContent = `${aircraftList.length} TRACKS`;
      document.getElementById('radar-detail-callsign').textContent = active.callsign;
      document.getElementById('radar-detail-airline').textContent = active.airline.toUpperCase();
      document.getElementById('radar-detail-dist').textContent = `${active.distKm.toFixed(1)} km`;
      document.getElementById('radar-detail-brg').textContent = `BRG ${String(active.bearingDeg).padStart(3, '0')}° (${active.bearingCard})`;
      document.getElementById('radar-detail-type').textContent = `${active.type} (${active.reg})`;
      document.getElementById('radar-detail-route').textContent = `${active.origin} (Origin) → ${active.dest} (Destination)`;

      layer.innerHTML = aircraftList.map(ac => {
        const scale = 155 / 45;
        const cx = 180 + Math.max(-150, Math.min(150, ac.xKm * scale));
        const cy = 180 - Math.max(-150, Math.min(150, ac.yKm * scale));
        const isSel = ac.id === active.id;
        return `
          <g onclick="selectAircraft('${ac.id}')" class="cursor-pointer">
            ${isSel ? `<circle cx="${cx}" cy="${cy}" r="9" fill="none" stroke="#f59e0b" stroke-width="1.5"/>` : ''}
            <circle cx="${cx}" cy="${cy}" r="3.5" fill="${isSel ? '#f59e0b' : '#10b981'}"/>
            <text x="${cx + 7}" y="${cy - 2}" fill="${isSel ? '#fbbf24' : '#f8fafc'}" font-family="JetBrains Mono" font-size="9" font-weight="bold">${ac.callsign}</text>
            <text x="${cx + 7}" y="${cy + 8}" fill="#64748b" font-family="JetBrains Mono" font-size="7.5">${Math.round(ac.altFt * 0.3048)}m • ${Math.round(ac.spdKts * 1.852)}k</text>
          </g>
        `;
      }).join('');
    }

    function renderBoard() {
      const sorted = [...aircraftList].sort((a, b) => a.distKm - b.distKm);
      document.getElementById('overhead-board-list').innerHTML = sorted.map(ac => `
        <div onclick="selectAircraft('${ac.id}', true)" class="avio-subcard p-3.5 flex items-center justify-between cursor-pointer hover:border-sky-500/40 transition">
          <div class="space-y-1">
            <div class="font-mono font-extrabold text-sm text-amber-400">${ac.callsign}</div>
            <div class="font-mono text-[11px] text-slate-400">${ac.reg}</div>
            <div class="font-mono text-[11px] text-sky-400 pt-1">${ac.origin} &rarr; ${ac.dest} • HDG ${ac.track}°</div>
            <div class="font-mono text-xs font-semibold text-slate-300">${Math.round(ac.spdKts * 1.852)} km/h</div>
          </div>
          <div class="text-right space-y-1">
            <div class="text-xs font-bold text-white">${ac.airline}</div>
            <div class="text-[11px] text-slate-400">${ac.type}</div>
            <div class="font-mono text-xs font-bold text-slate-200 pt-1">${Math.round(ac.altFt * 0.3048).toLocaleString()} m</div>
            <div class="font-mono text-[10px] text-slate-400">${ac.altFt.toLocaleString()} ft</div>
            <div class="font-mono text-xs font-extrabold text-emerald-400">${ac.distKm.toFixed(1)} km</div>
          </div>
        </div>
      `).join('');
      document.getElementById('board-scan-time').textContent = new Date().toTimeString().split(' ')[0];
    }

    function addCustomAircraft(e) {
      e.preventDefault();
      const callsign = document.getElementById('cust-callsign').value.toUpperCase().trim();
      const distKm = parseFloat(document.getElementById('cust-dist-km').value) || 12.5;
      const newAc = {
        id: 'custom_' + Date.now(),
        icao: callsign.slice(0, 3),
        callsign,
        airline: document.getElementById('cust-airline').value.trim(),
        type: document.getElementById('cust-type').value.trim(),
        reg: document.getElementById('cust-reg').value.toUpperCase().trim(),
        origin: document.getElementById('cust-origin').value.toUpperCase().trim(),
        dest: document.getElementById('cust-dest').value.toUpperCase().trim(),
        altFt: parseInt(document.getElementById('cust-alt-ft').value, 10) || 12000,
        vrate: 450,
        spdKts: parseInt(document.getElementById('cust-spd-kts').value, 10) || 280,
        distKm,
        bearingDeg: 180,
        bearingCard: 'S',
        track: 180,
        squawk: '7000',
        tailColor: document.getElementById('cust-color').value,
        stripeColor: document.getElementById('cust-color').value,
        xKm: 0,
        yKm: -distKm
      };
      aircraftList.unshift(newAc);
      selectedId = newAc.id;
      e.target.reset();
      selectAircraft(newAc.id, true);
    }

    function logCurrentAircraft() {
      const active = aircraftList.find(a => a.id === selectedId) || aircraftList[0];
      spottedLogs.unshift({
        id: Date.now(),
        callsign: active.callsign,
        reg: active.reg,
        type: active.type,
        airline: active.airline,
        route: `${active.origin} → ${active.dest}`,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      localStorage.setItem('avioframe_spotter_logs', JSON.stringify(spottedLogs));
      renderSpotterLogs();
      alert(`Logged ${active.callsign} (${active.reg}) to your Spotter Logbook!`);
    }

    function renderSpotterLogs() {
      const container = document.getElementById('spotter-logbook-list');
      document.getElementById('spotter-log-count').textContent = `${spottedLogs.length} LOGGED`;
      container.innerHTML = spottedLogs.length === 0
        ? `<p class="text-xs text-slate-500 text-center py-4">No aircraft logged yet. Tap "+ Log" on any flight in Poster view!</p>`
        : spottedLogs.map(item => `
            <div class="avio-subcard p-3 flex items-center justify-between text-xs">
              <div>
                <div class="font-mono font-bold text-amber-400">${item.callsign} • ${item.reg}</div>
                <div class="text-slate-300">${item.airline} (${item.type})</div>
                <div class="font-mono text-[10px] text-sky-400">${item.route}</div>
              </div>
              <div class="text-right font-mono text-[10px] text-slate-400">
                <div>${item.time}</div>
                <button onclick="deleteSpotterLog(${item.id})" class="text-rose-400 hover:underline mt-1">Remove</button>
              </div>
            </div>
          `).join('');
    }

    function deleteSpotterLog(id) {
      spottedLogs = spottedLogs.filter(l => l.id !== id);
      localStorage.setItem('avioframe_spotter_logs', JSON.stringify(spottedLogs));
      renderSpotterLogs();
    }

    function cycleLocation() {
      currentLocationIdx = (currentLocationIdx + 1) % LOCATIONS.length;
      const loc = LOCATIONS[currentLocationIdx];
      document.getElementById('header-location-label').textContent = loc.label;
      document.getElementById('radar-center-icao').textContent = loc.icao;
      document.getElementById('radar-legend-apt').textContent = `AIRFIELD (${loc.icao})`;
      fetchLiveADSB(true);
    }

    function toggleLiveSim() {
      liveSim = !liveSim;
      document.getElementById('live-dot').className = liveSim ? 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse' : 'w-2 h-2 rounded-full bg-slate-500';
      document.getElementById('live-pill-text').textContent = liveSim ? 'Live ADS-B • 1s' : 'Paused';
    }

    function toggleTheme() {
      isLight = !isLight;
      document.body.classList.toggle('light-theme', isLight);
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('sound-toggle-btn').classList.toggle('text-emerald-400', soundOn);
    }

    setInterval(tickOneSecondKinematics, 1000);
    setInterval(() => { if (liveSim) fetchLiveADSB(false); }, 15000);

    window.addEventListener('DOMContentLoaded', () => {
      updateAllViews();
      renderSpotterLogs();
      fetchLiveADSB(false);
    });
  </script>
</body>
